<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="primaryGrad" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="12" y1="36" x2="36" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#2DD4BF" />
    </linearGradient>
    <linearGradient id="lavenderGrad" x1="16" y1="12" x2="38" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#C4B5FD" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0D9488" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Base Rounded Container with dark navy tone -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#primaryGrad)" />
  
  <!-- Subtle inner border -->
  <rect x="2" y="2" width="44" height="44" rx="12" stroke="#334155" stroke-width="1" />

  <!-- Abstract Growth Stem / Arc -->
  <path d="M14 34C14 24 22 16 34 14" stroke="url(#tealGrad)" stroke-width="3.5" stroke-linecap="round" />

  <!-- Intersecting Connection Curve (Guidance Nexus) -->
  <path d="M14 22C20 22 26 18 34 26" stroke="url(#lavenderGrad)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="0.5 4" stroke-dashoffset="1" />

  <!-- Radiant Guidance Star / Apex Node -->
  <circle cx="34" cy="14" r="4.5" fill="#2DD4BF" filter="url(#glow)" />
  <circle cx="34" cy="14" r="2" fill="#FFFFFF" />

  <!-- Root Anchor Node -->
  <circle cx="14" cy="34" r="3" fill="#8B5CF6" />
  <circle cx="14" cy="34" r="1.2" fill="#FFFFFF" />

  <!-- Intermediate Synergy Growth Node -->
  <circle cx="25" cy="21" r="2.5" fill="#A78BFA" />
</svg>
